<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Rooftop System</title>
  <link rel="stylesheet" href="style.css?v=8" />
  
  <!-- Firebase & Libraries -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="dark-theme">
  <div class="mobile-container">

    <!-- PAGE 1: CONTROL HUB -->
    <section id="page-1" class="page-section active">
      
      <!-- Top Telemetry Row -->
      <div class="top-sensor-row">
        <div class="card sensor-card">
          <span class="sensor-title">TEMP</span>
          <div class="sensor-value"><span id="temp-val">--</span>°C</div>
        </div>
        <div class="card sensor-card">
          <span class="sensor-title">BRIGHT</span>
          <div class="sensor-value"><span id="bright-val">--</span> Lux</div>
        </div>
        <div class="card sensor-card">
          <span class="sensor-title">HUMID</span>
          <div class="sensor-value"><span id="humid-val">--</span>%</div>
        </div>
      </div>

      <!-- Live Status Card -->
      <div class="card live-status-card">
        <span class="card-label">Live Feed / Status</span>
        <div class="status-box">
          <span class="status-sub">Current Roof Position:</span>
          <h1 id="roof-status-display">CLOSED</h1>
        </div>
      </div>

      <!-- Manual Override Card -->
      <div class="card override-card">
        <div class="card-header">
          <h3>Manual Override</h3>
          <div class="mode-toggle-wrapper">
            <span class="mode-label">Mode</span>
            <label class="switch">
              <input type="checkbox" id="mode-switch" onchange="toggleMode(this)">
              <span class="slider round"></span>
            </label>
            <span id="mode-text" class="mode-state">Auto</span>
          </div>
        </div>

        <div class="action-buttons">
          <button id="btn-open" class="btn btn-action btn-open" onclick="setRoofStatus('OPEN')">Open Roof</button>
          <button id="btn-close" class="btn btn-action btn-close" onclick="setRoofStatus('CLOSED')">Close Roof</button>
        </div>
      </div>

      <!-- Navigation to Analytics -->
      <div class="nav-bottom">
        <button class="btn btn-nav" onclick="switchPage('page-2')">DATA & ANALYTICS ➔</button>
      </div>

    </section>

    <!-- PAGE 2: DATA & ANALYTICS -->
    <section id="page-2" class="page-section">
      
      <div class="page-header">
        <button class="btn-back" onclick="switchPage('page-1')">⬅ Back</button>
        <h2>Telemetry Analytics</h2>
      </div>

      <div id="export-container">
        <!-- Live Graph -->
        <div class="card chart-card">
          <canvas id="telemetryChart"></canvas>
        </div>

        <!-- History Table Card -->
        <div class="card table-card">
          <div class="table-header">
            <h3>History Logs (5s Tick)</h3>
            
            <div class="filter-wrapper">
              <label for="table-filter">Filter:</label>
              <select id="table-filter" class="filter-dropdown" onchange="applyTableFilter(this.value)">
                <option value="all">All Time</option>
                <option value="24h">Last 24 Hours</option>
                <option value="7d">Last 7 Days</option>
              </select>
            </div>
          </div>

          <div class="table-wrapper">
            <table id="telemetry-table">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Temp</th>
                  <th>Humid</th>
                  <th>Bright</th>
                  <th>Rain</th>
                  <th>Roof</th>
                </tr>
              </thead>
              <tbody id="table-body">
                <!-- Dynamic Logs (Every 5 Seconds) -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Print Action Area -->
      <div class="pdf-action-area">
        <button class="btn btn-pdf" onclick="openReportModal()">📄 View & Print Report</button>
      </div>

    </section>

  </div>

  <!-- PRINT REPORT MODAL OVERLAY -->
  <div id="report-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Telemetry Report Preview</h3>
        <button class="btn-close-modal" onclick="closeReportModal()">✕</button>
      </div>
      <div id="modal-report-body" class="modal-body">
        <!-- Report Preview Inserted via JS -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-nav" onclick="closeReportModal()">Close</button>
        <button class="btn btn-pdf" onclick="triggerDownloadPDF()">Download PDF</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=8"></script>
</body>
</html>
